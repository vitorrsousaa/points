getAthleteGrowth:
  summary: /athlete-growth
  description: This endpoint returns the percentage growth in the number of athletes for a coach, comparing the current month with the previous month. The growth is calculated based on the number of athletes registered in both periods.
  security:
    - CognitoAuthorizer: []
  tags:
    - Coaches
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              growth:
                type: number
                example: 40
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 404
      responseBody:
        description: Coach not found
      responseModels:
        application/json:
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                description: Coach not found
                example: Coach not found
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
