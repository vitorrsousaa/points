createCoach:
  summary: create
  description: Route to create coach
  tags:
    - Coaches
  requestBody:
    description: A basic information about user.
    required: true
  requestModels:
    application/json: CoachSignupModel
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return the userId create by the server
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              userId:
                type: string
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              userId:
                type: string
                example: b70f0460-ca06-4769-bb01-ea5b6f0a0245
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
