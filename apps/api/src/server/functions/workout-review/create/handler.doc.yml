createWorkoutReview:
  summary: /workout-review
  description: This endpoint is used to create a workout review
  security:
    - CognitoAuthorizer: []
  tags:
    - Workout Review
  pathParams:
    - name: "coachId"
      description: "The coachId to filter coach"
      schema:
        type: "string"
        example: "example-uuid"
  requestBody:
    description: Sample request body
    required: true
  requestModels:
    application/json: 
      $schema: http://json-schema.org/draft-04/schema#
      properties:
        email:
          type: string
          example: user@email.com
      required:
        - email
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                example: ok
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 404
      responseBody:
        description: Athlete not found
      responseModels:
        application/json:
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                description: Athlete not found
                example: Athlete not found
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
