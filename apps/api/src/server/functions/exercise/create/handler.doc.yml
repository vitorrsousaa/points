createExercise:
  summary: exercise
  description: This route creates a new exercise
  security:
    - CognitoAuthorizer: []
  tags:
    - Exercises
  requestBody:
    description: Sample request body
    required: true
  requestModels:
    application/json: ExerciseInputModel
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: ExerciseModel
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse