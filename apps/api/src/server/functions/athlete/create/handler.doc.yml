createAthlete:
  summary: create
  description: Route to create athlete
  tags:
    - Athletes
  requestBody:
    description: A basic information about user.
    required: true
  requestModels:
    application/json: AthleteSignupModel
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: AthleteModel
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
