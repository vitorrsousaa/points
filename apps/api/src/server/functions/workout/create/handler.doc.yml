create:
  summary: workout
  description: Create workout
  security:
    - CognitoAuthorizer: []
  tags:
    - Workouts
  requestBody:
    description: A basic information about workout
    required: true
  requestModels:
    application/json: 
      $schema: http://json-schema.org/draft-04/schema#
      properties:
        athleteId:
          type: string
          format: uuid
          example: '123456'
        workout:
          type: object
          schema: $WorkoutInputModel
      required:
        - athleteId
        - workout
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return workout created
      responseModels:
        application/json: WorkoutModel
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse