update:
  summary: workout
  description: This route updates a workout
  security:
    - CognitoAuthorizer: []
  tags:
    - Workouts
  requestBody:
    description: A basic information about workout
    required: true
  requestModels:
    application/json: WorkoutInputModel
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return all workouts of athlete
      responseModels:
        application/json: WorkoutModel
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 403
      responseBody:
        description: Workout is owned by other coach
      responseModels:
        application/json:
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                description: Workout is owned by other coach
                example: Workout is owned by other coach
    - statusCode: 404
      responseBody:
        description: User not found
      responseModels:
        application/json:
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                description: User not found
                example: User not found
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse