getAllByAthleteId:
  summary: workouts/getAllByAthleteId
  description: Get all workouts by athlete id
  security:
    - CognitoAuthorizer: []
  tags:
    - Workouts
  pathParams:
    - name: "athleteId"
      description: "The athleteId to filter athletes"
      schema:
        type: "string"
        example: "example-uuid"
  queryParams:
    - name: "status"
      description: "The status of the workout"
      required: true
      schema:
        type: "string"
        format: "enum"
        example: "active"
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return all workouts of athlete
      responseModels:
        application/json: WorkoutsResponse
    - statusCode: 401
      responseBody:
        description: Not authorized
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse