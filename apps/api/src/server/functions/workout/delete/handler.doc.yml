delete:
  summary: /workout
  description: Route to delete a workout
  security:
    - CognitoAuthorizer: []
  tags:
    - Workouts
  queryParams:
    - name: "workoutId"
      description: "The workoutId to delete"
      required: true
      schema:
        type: "string"
        example: "4df43fc4-fbf5-4286-9b51-edf852db180d"
    - name: "athleteId"
      description: "The athlete who owns the workout"
      required: true
      schema:
        type: "string"
        example: "4df43fc4-fbf5-4286-9b51-edf852db180d"
  methodResponses:
    - statusCode: 201
      responseBody:
        description: Return default response
    - statusCode: 401
      responseBody:
        description: Not authorized
    - statusCode: 403
      responseBody:
        description: Coach not authorized to delete this workout
    - statusCode: 404
      responseBody:
        description: Workout not found
      responseModels:
        application/json: NotAuthorizedResponse
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse