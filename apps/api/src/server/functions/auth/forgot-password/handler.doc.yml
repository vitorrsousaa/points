forgotPassword:
  summary: /auth/forgot-password
  description: Route to get code to reset password
  security: []
  tags:
    - Auth
  requestBody:
    description: Sample request body
    required: true
  requestModels:
    application/json: 
      $schema: http://json-schema.org/draft-04/schema#
      properties:
        email:
          type: string
          example: user@email.com
      required:
        - email
  methodResponses:
    - statusCode: 204
      responseBody:
        description: Return default response
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                example: ok
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
