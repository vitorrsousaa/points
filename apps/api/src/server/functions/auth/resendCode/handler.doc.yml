resendCode:
  summary: auth/resend-code
  description: This endpoint resends the code to the user's email
  security:
    - CognitoAuthorizer: []
  tags:
    - Auth
  pathParams:
    - name: "email"
      description: The email to resend code
      schema:
        type: "string"
        example: "email@email.com"
  methodResponses:
    - statusCode: 200
      responseBody:
        description: Return default response
      responseModels:
        application/json: 
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                example: ok
    - statusCode: 404
      responseBody:
        description: User not found
      responseModels:
        application/json:
          schema:
            $schema: http://json-schema.org/draft-04/schema#
            properties:
              message:
                type: string
                description: User not found
                example: User not found
    - statusCode: 422
      responseBody:
        description: An error message when send invalid data
      responseModels:
        application/json: ValidationErrorResponse
    - statusCode: 500
      responseBody:
        description: An unknown error message
      responseModels:
        application/json: ErrorResponse
