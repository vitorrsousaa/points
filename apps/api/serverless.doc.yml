documentation:
  version: '1.0.0'
  title: Grypp-API docs
  description: 'API documentation about api'
  security:
    - CognitoAuthorizer: []
  securitySchemes:
      CognitoAuthorizer: 
        type: http
        scheme: bearer
        bearerFormat: JWT
  tags:
    - name: Auth
      description: 'Routes for authentication'
      x-displayName: Authentication
    - name: Athletes
      description: 'Routes for athletes'
    - name: Exercises
      description: 'Routes for exercises'
    - name: Workouts
      description: 'Routes for workouts'
    - name: Settings
      description: 'Routes for Settings'
  models:
    - name: ValidationErrorResponse
      description: This is a schema for responses when occurs errors on validation schema.
      contentType: application/json
      schema: ${file(docs/models/validation-response.json)}
    - name: ErrorResponse
      description: This is a schema for unknown or server errors.
      contentType: application/json
      schema: ${file(docs/models/error-response.json)}
    - name: PutDocumentResponse
      description: PUT Document response model (external reference example)
      contentType: application/json
      schema: ${file(docs/models/put-document-response.json)}
    - name: AuthSignupModel
      description: Auth signup model
      contentType: application/json
      schema: ${file(docs/models/auth/signup.json)}
    - name: NotAuthorizedResponse
      description: Not Authorized response model
      contentType: application/json
      schema: 
        $schema: http://json-schema.org/draft-04/schema#
        type: object
        properties:
          message:
            type: string
            description: Not Authorized
            example: Not Authorized
    - name: SettingsModel
      description: Settings response model
      contentType: application/json
      schema: 
        $schema: http://json-schema.org/draft-04/schema#
        type: object
        properties:
          id: 
            type: string
            format: uuid
            example: '4df43fc4-fbf5-4286-9b51-edf852db180d'
          userId:
            type: string
            format: uuid
            example: '4df43fc4-fbf5-4286-9b51-edf852db180d'
          enable:
            type: boolean
            example: true
          steps:
            type: object
            properties:
              stepOne:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['pending', 'completed']
                    example: 'pending'
                required:
                  - status
              stepTwo:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['pending', 'completed']
                    example: 'completed'
                required:
                  - status
            required:
              - stepOne
              - stepTwo
        required:
          - id
          - userId
          - enable
          - steps
    - name: AthleteModel
      description: Athlete model
      content: 
        application/json:
          schema: &AthleteModel
            type: object
            properties:
              id: 
                type: string
                format: uuid
                example: 123456
              name:
                type: string
                example: John Doe
              coachId:
                type: string
                format: uuid
                example: 123456
              weight:
                type: number
                example: 80
              height:
                type: number
                example: 180
              age:
                type: number
                example: 30
              email:
                type: string
                example: email@email.com
    - name: AthletesResponse
      description: Athletes response model
      content:
        application/json:
          schema:
            type: array
            items: *AthleteModel
    - name: ExerciseModel
      description: Exercise model
      content: 
        application/json:
          schema: &ExerciseModel
            type: object
            properties:
              id: 
                type: string
                format: uuid
                example: 123456
              name:
                type: string
                example: Pendlay Row
              primaryMuscle:
                type: string
                example: Biceps
              secondaryMuscle:
                oneOf:
                  - type: string
                  - type: "null"
                example: Triceps
              target:
                oneOf:
                  - type: string
                    enum: ["S", "B", "D"]
                    example: S
                  - type: "null"
                example: S
              equipment:
                type: string
                enum: ["Barra", "Halter", "Máquina"]
                example: Barra
    - name: ExercisesResponse
      description: Exercises response model
      content:
        application/json:
          schema:
            type: array
            items: *ExerciseModel
    - name: WorkoutSetModel
      description: Workout set model
      content:
        application/json:
        schema: &WorkoutSetModel
          type: object
          properties:
            reps:
              type: number
              example: 10
            weight:
              type: number
              example: 50
            type: 
              type: string
              enum: ["W", "T"]
            rpe:
              type: number
              minimum: 0
              maximum: 10
              example: 7
              description: |
                Rate of Perceived Exertion (RPE) for the workout set.
                This field is optional and can be omitted or set to null.
          required:
            - reps
            - weight
            - type
    - name: WorkoutExerciseModel
      description: Workout exercise model
      content:
        application/json:
        schema: &WorkoutExerciseModel
          type: object
          properties:
            restTime:
              type: string
              example: '04:30'
            exerciseId:
              type: string
              format: uuid
              example: '123456'
            notes:
              type: string
              example: 'Do it slowly'
            sets:
              type: array
              items: *WorkoutSetModel
          required:
            - restTime
            - exerciseId
            - sets
            - notes
    - name: WorkoutModel
      description: Workout model
      content: 
        application/json:
          schema: &WorkoutModel
            type: object
            properties:
              id: 
                type: string
                format: uuid
                example: '123456'
              createdAt:
                type: string
                example: '2024-08-13T21:23:33.482Z'
              name:
                type: string
                example: Workout start
              updatedAt:
                type: string
                example: '2024-08-13T21:23:33.482Z'
              visibility:
                type: boolean
                example: true
              athleteId: 
                type: string
                format: uuid
                example: '123456'
              coachId: 
                type: string
                format: uuid
                example: '123456'
              exercises:
                type: array
                items: *WorkoutExerciseModel
    - name: WorkoutInputModel
      description: Workout input model
      content: 
        application/json:
          schema: &WorkoutModel
            type: object
            properties:
              name:
                type: string
                example: Workout one
              athleteId: 
                type: string
                format: uuid
                example: '123456'
              exercises:
                type: array
                items: *WorkoutExerciseModel
    - name: WorkoutsResponse
      description: Workouts response model
      content:
        application/json:
          schema:
            type: array
            items: *WorkoutModel