name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  pull_request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Run Typechecking
        run: pnpm run typecheck

      - name: Run the tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build