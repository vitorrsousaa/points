version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  
  pre_build:
    commands:
      - yarn install --lock-file
      
  build:
    commands:
      - yarn build
      
  post_build:
    commands:
      - aws s3 sync --delete 'PASTA DO CLIENT' s3://${DEPLOY_BUCKET_CLIENT}
      - aws cloudfront create-invalidation --distribution-id ${CF_ID_CLIENT} --paths /index.html
      - aws s3 sync --delete 'PASTA DO NEXT' s3://${DEPLOY_BUCKET_NEXT}
      - aws cloudfront create-invalidation --distribution-id ${CF_ID_NEXT} --paths /index.html